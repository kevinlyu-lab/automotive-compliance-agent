[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fusa-sotif-harness"
version = "0.1.0"
description = "Terminal FuSa and SOTIF analysis draft harness"
requires-python = ">=3.9"

[project.scripts]
fusa-harness = "fusa_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
